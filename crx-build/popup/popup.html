<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Adyen Session Copier</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: min(380px, 100vw);
      background: #0b0e13;
      color: #dde4ee;
      font-family: 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      padding: 0;
    }
    .topbar {
      background: linear-gradient(135deg, #00d1b2, #00a88c);
      color: #00110d;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topbar b { font-size: 14px; letter-spacing: .4px; }
    .topbar button {
      background: #00110d22;
      border: none;
      color: #00110d;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
    }
    .topbar button:hover { background: #00110d33; }
    .status {
      padding: 8px 14px;
      color: #6b7b8d;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #1a2430;
    }
    #requests { padding: 10px 14px 14px; }
    .empty {
      color: #6b7b8d;
      text-align: center;
      padding: 26px 10px;
      line-height: 1.6;
    }
    .empty small { color: #46566a; }
    .req-card {
      border: 1px solid #1f2a33;
      border-radius: 10px;
      margin-bottom: 8px;
      overflow: hidden;
      background: #10151c;
    }
    .req-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      cursor: pointer;
    }
    .req-header:hover { background: #141b24; }
    .url-wrap { flex: 1; overflow: hidden; }
    .url {
      font-family: Consolas, Menlo, monospace;
      font-size: 11px;
      color: #7fd4c2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }
    .method {
      font-size: 10px;
      font-weight: 700;
      color: #ffd166;
      margin-right: 6px;
    }
    .btn-copy {
      background: #23303c;
      border: none;
      color: #e6e6e6;
      padding: 6px 12px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .btn-copy:hover { background: #2b3b4a; }
    .detail { display: none; padding: 0 10px 10px; }
    .detail.open { display: block; }
    .detail-label {
      font-size: 10px;
      text-transform: uppercase;
      color: #6b7b8d;
      margin: 6px 0 6px;
    }
    .detail pre {
      background: #0a0d12;
      border: 1px solid #1a2430;
      border-radius: 8px;
      padding: 10px;
      font-family: Consolas, Menlo, monospace;
      font-size: 10.5px;
      color: #9be;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 260px;
      overflow: auto;
      line-height: 1.5;
    }
    .detail-actions { margin-top: 8px; display: flex; justify-content: flex-end; }
    .btn-copy-detail {
      display: flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #00d1b2, #00a88c);
      color: #00110d;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }
    .btn-copy-detail .icon { width: 14px; height: 14px; fill: currentColor; }
    .btn-copy-detail.copied { background: #3fbf8d; }
    .btn-copy.copied { background: #3fbf8d; color: #00110d; }
    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 2px 0 10px;
    }
    .bar span { font-size: 11px; color: #6b7b8d; }
    .hint {
      font-size: 10px;
      color: #46566a;
      margin-top: 6px;
      text-align: center;
      border-top: 1px solid #1a2430;
      padding-top: 8px;
    }
    .tipbar {
      padding: 8px 14px;
      background: #10151c;
      border-bottom: 1px solid #1a2430;
      font-size: 10px;
      color: #7fd4c2;
    }
    #proxy-status {
      padding: 7px 14px;
      background: #0a0d12;
      border-bottom: 1px solid #1a2430;
      font-size: 11px;
      color: #8fa3b5;
    }
    #proxy-status b { color: #00d1b2; }
    @media (max-width: 420px) {
      body { font-size: 12px; }
      .topbar { padding: 10px 12px; }
      .topbar b { font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <b>ADYEN SESSION COPIER</b>
    <div style="display:flex;gap:6px">
      <button id="proxy" title="Proxy settings">&#9889; PROXY</button>
      <button id="clear">Clear</button>
    </div>
  </div>

  <div class="status">
    <span>Requests captured</span>
    <span id="count">0</span>
  </div>

  <div id="proxy-status" style="display:none"></div>

  <div class="tipbar">
    Capture picks up checkoutshopper sessions requests. Tap a row to expand, then copy the cURL.
  </div>

  <div id="requests"></div>

  <script src="popup.js"></script>
</body>
</html>
