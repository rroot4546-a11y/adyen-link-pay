<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Adyen Auto-Pay</title>
  <style>
    body { width: 320px; background: #0f1115; color: #e6e6e6;
           font-family: 'Segoe UI', monospace; padding: 14px; }
    h1 { font-size: 15px; margin: 0 0 10px 0; color: #00d1b2; }
    label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
            color: #888; display: block; margin: 10px 0 4px 0; }
    input, select { width: 100%; padding: 8px; box-sizing: border-box;
                    border: 1px solid #2a2e38; background: #171a21; color: #e6e6e6;
                    border-radius: 4px; font-size: 13px; }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    button { width: 100%; padding: 10px; margin-top: 14px;
             background: #00d1b2; color: #000; border: none;
             border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; }
    button:hover { background: #00b39a; }
    #status { margin-top: 10px; font-size: 12px; color: #ffcc00; }
    #lastCardInfo { margin-top: 10px; font-size: 11px; color: #9be; word-break: break-all; }
    .chk { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
    .chk input { width: auto; }
    .chk label { margin: 0; }
  </style>
</head>
<body>
  <h1>Adyen Link Auto-Pay</h1>

  <label>Custom BIN</label>
  <input id="bin" type="text" placeholder="e.g. 411111111111" maxlength="19" inputmode="numeric">

  <div class="row">
    <div>
      <label>Card Length</label>
      <select id="cardLength">
        <option value="16">16</option>
        <option value="15">15</option>
        <option value="19">19</option>
      </select>
    </div>
    <div>
      <label>Card Holder</label>
      <input id="holder" type="text" placeholder="JOHN DOE">
    </div>
  </div>

  <div class="row">
    <div class="chk">
      <input id="autoSubmit" type="checkbox">
      <label for="autoSubmit">Auto Submit</label>
    </div>
    <div class="chk">
      <input id="autoOnLoad" type="checkbox">
      <label for="autoOnLoad">Auto on Load</label>
    </div>
  </div>

  <button id="payBtn">Generate &amp; Pay Now</button>

  <div id="status"></div>
  <div id="lastCardInfo"></div>

  <script src="popup.js"></script>
</body>
</html>
